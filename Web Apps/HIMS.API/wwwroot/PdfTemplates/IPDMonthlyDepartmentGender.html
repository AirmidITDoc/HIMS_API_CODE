<!DOCTYPE html>
<html>
<head>
    <style>
        .report-header {
            width: 100%;
            text-align: center;
            font-family: Arial, sans-serif;
            margin-bottom: 8px;
        }

        .report-name {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .report-info {
            width: 100%;
            font-size: 10px;
            font-family: Arial, sans-serif;
            margin-bottom: 8px;
        }

        .report-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            font-family: Arial, sans-serif;
            font-size: 8px;
        }

            .report-table th,
            .report-table td {
                border: 1px solid #555;
                padding: 3px 2px;
                text-align: center;
                vertical-align: middle;
            }

            .report-table th {
                font-weight: bold;
            }

            .report-table .date-column {
                width: 60px;
            }

            .report-table .department-column {
                width: 55px;
            }

            .report-table .total-column {
                width: 45px;
            }

            .report-table .date-value {
                white-space: nowrap;
            }

            .report-table .grand-total td {
                font-weight: bold;
            }
    </style>
</head>

<body>

    {{HospitalHeader}}

    <div class="report-header">
        <div class="report-name">
            IPD Count Report
        </div>
    </div>
    <table class="report-info">
        <tr>
            <td style="text-align: left; font-weight: bold;">
                From Date : {{FromDate}} -- To Date : {{ToDate}}
            </td>
            <td style="text-align: right; font-weight: bold;">
                Print Date : {{CurrentDate}}
            </td>
        </tr>
    </table>
    {{ReportTable}}

</body>
</html>
