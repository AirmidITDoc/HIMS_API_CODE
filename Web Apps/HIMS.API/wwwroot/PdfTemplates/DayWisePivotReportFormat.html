<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <style>

        @page {
            size: A4 landscape;
            margin: 8mm;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 7px;
            color: #000;
        }

        .report-header {
            text-align: center;
            font-weight: bold;
            font-size: 11px;
            margin-bottom: 2px;
        }

        .report-sub-header {
            text-align: center;
            font-weight: bold;
            font-size: 9px;
            margin-bottom: 2px;
        }

        .report-month {
            text-align: center;
            font-weight: bold;
            font-size: 9px;
            margin-bottom: 5px;
        }

        .report-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

            .report-table th,
            .report-table td {
                border: 1px solid #000;
                padding: 3px 3px;
                text-align: center;
                vertical-align: middle;
                line-height: 1.3;
                height: 16px;
                font-size: 8px;
            }

        .sr-column {
            width: 30px;
        }

        .karma-column {
            width: 100px;
            text-align: left !important;
        }

        .service-column {
            width: 110px;
            text-align: left !important;
        }

        .day-column {
            width: 27px;
        }

        .total-column {
            width: 32px;
        }
        .karma-name {
            text-align: left !important;
            white-space: nowrap;
        }

        .service-name {
            text-align: left !important;
            white-space: nowrap;
        }

        .grand-total {
            font-weight: bold;
        }

            .grand-total td {
                font-weight: bold;
            }

        .total-header {
            font-weight: bold;
        }

        tr {
            page-break-inside: avoid;
        }

        thead {
            display: table-header-group;
        }
    </style>

</head>

<body>

    {{HospitalHeader}}

    <!--<div class="report-header">
        MAM'S SUMATIBHAI SHAH AYURVED MAHAVIDYALAYA
    </div>-->

    <div class="report-sub-header" style="font-size: 15px; font-weight: bold;">
        PANCHKARMA REPORT
    </div>

    <div class="report-month" style="position: relative; text-align: center; font-weight: bold; font-size: 9px;">

        {{ReportMonth}}

        <span style="position: absolute; right: 0; top: 0; font-size: 9px; font-weight: bold;">
            Print Date: {{CurrentDate}}
        </span>

    </div>

    {{ReportTable}}

</body>

</html>
