<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">

        @page {
            size: A4 landscape;

            box-sizing: border-box;

            margin: 0;
            padding: 0;

            font-weight: bold;

            border-collapse: collapse;

        }

            .report-table th,
            .report-table td {
                border: 1px solid #000;
                padding: 3px 3px;
                text-align: center;
                vertical-align: middle;
                line-height: 1.3;
                height: 16px;
                font-size: 8px;
            }

            width: 30px;
        }

</head>
